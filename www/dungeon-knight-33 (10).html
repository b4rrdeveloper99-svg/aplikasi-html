function stickBase(neon,aim){
 const N=88,C=43.5;
 return mk(N,N,x=>{
  const P=(X,Y,col)=>{x.fillStyle=col;x.fillRect(X,Y,1,1)};
  for(let Y=0;Y<N;Y++)for(let X=0;X<N;X++){
   const dx=X-C,dy=Y-C,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx),lit=Math.cos(a+2.36);
   if(r>43)continue;
   /* tonjolan hias di tepi */
   const q=Math.PI/4,ad=Math.abs(((a+q/2+8*q)%q)-q/2),card=Math.abs(Math.round(a/(Math.PI/2))*(Math.PI/2)-a)<.01+0*1||ad<.0001;
   const ang=((a%(Math.PI/2))+Math.PI/2)%(Math.PI/2),dc=Math.min(ang,Math.PI/2-ang);
   const isCard=dc<.2,dd=Math.abs(Math.abs(((a+Math.PI*2)%(Math.PI/2))-Math.PI/4)),isDiag=!isCard&&Math.abs(ang-Math.PI/4)<.15;
   let ext=0;
   if(isCard)ext=5.5*(1-dc/.2);else if(isDiag)ext=3.5*(1-Math.abs(ang-Math.PI/4)/.15);
   if(r>=33&&r<38+ext&&ext>.6){const lum=60+lit*22+hs(X,Y,1)*5;P(X,Y,(r>37+ext-.9)?'#15141c':'rgb('+(lum|0)+','+(lum|0)+','+((lum+11)|0)+')');continue}
   if(r>=38){const k=(43-r)/5;x.fillStyle=rgba(neon,(k*k*.22).toFixed(3));x.fillRect(X,Y,1,1);continue}
   if(r>=29){ /* cincin batu */
    if(r>=37){P(X,Y,'#16151d');continue}
    if(r<30){P(X,Y,'#0f0f16');continue}
    const seg=((a+Math.PI)/(Math.PI/12)),fr=seg-Math.floor(seg);
    if(fr<.07||fr>.97){P(X,Y,'#17161e');continue}
    const lum=46+lit*18+hs(Math.floor(seg),Math.floor(r),2)*8;
    P(X,Y,'rgb('+(lum|0)+','+(lum|0)+','+((lum+10)|0)+')');
    if(r<31&&lit>0){x.fillStyle='rgba(255,255,255,.07)';x.fillRect(X,Y,1,1)}
    continue}
   if(r>=25){ /* neon */
    const t=Math.abs(r-27.1);
    if(t<.5)P(X,Y,'rgb('+(neon[0]+(255-neon[0])*.6|0)+','+(neon[1]+(255-neon[1])*.6|0)+','+(neon[2]+(255-neon[2])*.6|0)+')');
    else if(t<1.3)P(X,Y,rgba(neon,1));
    else{P(X,Y,'#0b0e14');x.fillStyle=rgba(neon,(.5*(1-(t-1.3)/.9)).toFixed(3));x.fillRect(X,Y,1,1)}
    continue}
   /* piringan dalam */
   if(r>=23.4){P(X,Y,'#0e1118');continue}
   if(r<13.6){ if(r>=12.4){x.fillStyle='#0a0c11';x.fillRect(X,Y,1,1);x.fillStyle=rgba(neon,.5);x.fillRect(X,Y,1,1)}else P(X,Y,'#0d0f15');continue}
   const side=Math.abs(dx)>Math.abs(dy);
   let lum=side?33:27;lum+=hs(X,Y,5)*5;if(hs(X,Y,9)>.965)lum+=14;
   const sd=Math.abs(Math.abs(dx)-Math.abs(dy));
   if(sd<.8)P(X,Y,'#0d1017');else if(sd<1.7)P(X,Y,'#323848');
   else P(X,Y,'rgb('+(lum|0)+','+((lum+3)|0)+','+((lum+11)|0)+')');
  }
  const cx=44,cy=44;
  if(!aim){ /* panah arah */
   const arr=(ox,oy,d)=>{
    const put=(i,j,col)=>{let u=i,v=j;if(d==1){u=-j;v=i}else if(d==2){u=-i;v=-j}else if(d==3){u=j;v=-i}P(ox+u,oy+v,col)};
    for(let i=0;i<4;i++)for(let j=-i;j<=i;j++)put(j,-4+i,(i==0||Math.abs(j)==i)?'#9cc8e8':'#6aa2cc');
    for(let i=4;i<8;i++)for(let j=-1;j<=1;j++)put(j,-4+i,j==1?'#4a7fa8':'#6aa2cc');
    for(let j=-1;j<=1;j++)put(j,3,'#37668d');
   };
   arr(cx,cy-19,0);arr(cx+19,cy,1);arr(cx,cy+19,2);arr(cx-19,cy,3);
  }else{ /* bidik */
   for(let Y=0;Y<N;Y++)for(let X=0;X<N;X++){const r=Math.hypot(X-C,Y-C);if(Math.abs(r-17.6)<.75)P(X,Y,'#ff8a1e')}
   for(let i=15;i<=23;i++){P(cx,cy-i,'#ff8a1e');P(cx,cy+i-1,'#ff8a1e');P(cx-i,cy,'#ff8a1e');P(cx+i-1,cy,'#ff8a1e')}
   for(const k of[-1,1]){P(cx+k*2,cy-21,'#c85f10');P(cx+k*2,cy+20,'#c85f10');P(cx-21,cy+k*2,'#c85f10');P(cx+20,cy+k*2,'#c85f10')}
  }
 });
}

   const dx=X-C,dy=Y-C,r=Math.hypot(dx,dy);if(r>13.6)continue;

body=function(x,y,f,h){

 if(!d||!im.complete||!im.naturalWidth){_body(x,y,f,h);return}
 const moving=typeof p!=='undefined'&&p&&p.C===h&&p.mvd;
 const bob=moving?Math.abs(Math.sin(time*20))*1.8:0,wob=moving?Math.sin(time*20)*.07:0,sq=moving?1+Math.sin(time*40)*.025:1;

 g.restore();

 if(typeof st!=='undefined'&&st==='menu'&&h.w!=null&&typeof WP!=='undefined'&&WP[h.w]){
  const w=WP[h.w];g.save();g.translate(x+3,y+10-(HAND[h.n]||11));if(w.n==='Wand')g.rotate(-.9);
  try{wheld(w)}catch(e){}
  g.restore();
 }
};

};
